name: Weekly dependency + lint sweep
on:
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC every Monday
jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            Run `pnpm lint` and `pnpm test`. If either fails, open a GitHub
            issue summarizing the failures with file:line references. If
            both pass, do nothing.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(pnpm lint),Bash(pnpm test *),mcp__github__create_issue"
